# The suite lives in tests/. Nowhere else: `testpaths` keeps a bare `python3 -m pytest` from collecting stray files elsewhere in the checkout
# (a collection error aborts the whole run). To see that guard fail, delete `testpaths` and run `python3 -m pytest --collect-only -q`.
[pytest]
testpaths = tests
norecursedirs = work .worktrees .git node_modules reports

# a full run stopped progressing and the last id printed under `-v` was
# read as "the hanging test". It was not — with output redirected, stdout is
# block-buffered, so the last VISIBLE line lags the true position by about one
# 8KB buffer. These param ids run 400+ characters; 321+60+188 = 569 completed
# against collection index 598 for that node, a gap of roughly one buffer.
# faulthandler makes the question unnecessary: any thread blocked longer than
# this dumps every stack and NAMES ITSELF instead of stalling the run silently.
# pytest-timeout is not installed and is not needed for this; faulthandler is
# built into pytest.
faulthandler_timeout = 120

# Browser-driven tests are selected with `-m browser`; the public CI selection is `not browser and not live` (see docs/testing.md).
markers =
    browser: drives a real browser; may be selected into its own run with -m browser
    slow: heavy reproduction (allocates ~1.3 GB); selected only with CERES_RUN_SLOW=1
    live: talks to the game's API directly; maintainer machine only, never CI

# mixed sync Playwright / asyncio.run browser files need fresh processes.
# Run such files in fresh processes (one pytest invocation per file). No coverage is deselected here.
