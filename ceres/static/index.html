<!-- (maintainer: browser zoom as a layout mechanism is forbidden; "the table must scale to all
 sizes gracefully"): there is NO page zoom. The board lays out at the browser's own CSS width, so
 the user's own browser zoom and Windows scaling (125-150%) simply work. This pre-paint block only
 publishes the board width -- `--ceres-vw`/`--ceres-vh` and the width classes. The classes are
 kept by NAME (the phone switch `ceres-lw-le-1279` and the other readers select on them); `s` is
 the always-reserved scrollbar gutter (scrollbar-gutter: stable), read from a zero-height probe so
 the width never flips with content height. `window.ceresScale.design` is that width, for the
 ?diag=width panel; there is no factor any more. -->
<script>(function(){
  var root=document.documentElement;
  var player=new URLSearchParams(location.search).get('player');
  root.classList.toggle('start-page',!String(player||'').trim());
  function apply(){
    root.style.scrollbarGutter='stable';
    // The same thin page scrollbar ceres.css gives html, set here because this block
    // runs before that stylesheet loads: measured without it, the gutter is the classic
    // one (15px instead of 10px in Chromium), so the first tier -- and the first render,
    // table or cards -- was decided for a board 5px narrower than the one shown.
    root.style.scrollbarWidth='thin';
    var probe=document.createElement('div');
    probe.style.cssText='display:block;height:0;margin:0;padding:0;border:0;visibility:hidden';
    root.appendChild(probe);
    var s=window.innerWidth-probe.getBoundingClientRect().width;
    root.removeChild(probe);
    var w=window.innerWidth-s;
    // The class boundaries are in em (16px units of the ROOT font), the standard for
    // text-driven layouts: a larger browser text size narrows the effective width the
    // same way browser zoom does, so text that no longer fits the table moves to the
    // card view instead of being cut off. At the default 16px root font e === w.
    var rem=parseFloat(getComputedStyle(root).fontSize)||16, e=w*16/rem;
    root.style.setProperty('--ceres-vw',(w/100)+'px');
    root.style.setProperty('--ceres-vh',(window.innerHeight/100)+'px');
    root.classList.toggle('ceres-lw-le-1919',e<=1919);
    // measured follow-up: the frozen table text/row sizes overflow
    // `.table-scroll` (clip, no scrollbar) with the three material-input columns
    // visible from 1440 up to ~1650 -- fits again from 1680. Own tier, not reused
    // from ceres-lw-le-1659 (that one already drives other, unrelated rules).
    // review fix (2026-09-20): the sort chevron's own inline-flow width (~4.8px
    // per sortable header) pushed the overflow threshold out from ~1680 to ~1755
    // MEASURED headless with the chevron change live: 1680 overflows by ~51px, fits
    // clean again at 1760. Tier renamed 1679 -> 1759 to match (nothing else reads the
    // 1679 name, grepped clean).
    root.classList.toggle('ceres-lw-le-1759',e<=1759);
    root.classList.toggle('ceres-lw-le-1659',e<=1659);
    root.classList.toggle('ceres-lw-le-1439',e<=1439);
    root.classList.toggle('ceres-lw-le-1279',e<=1279);
    root.classList.toggle('ceres-lw-le-767',e<=767);
    root.classList.toggle('ceres-lw-ge-1400',e>=1400);
    root.classList.toggle('ceres-lw-le-1099',e<=1099);
    root.classList.toggle('ceres-lw-le-544',e<=544);
    root.classList.toggle('ceres-lw-le-960',e<=960);
    root.dataset.ceresScale='w='+window.innerWidth+' sb='+s;
    window.ceresScale={design:w,apply:apply};
  }
  // the retired zoom scaler's saved keys.
  try{localStorage.removeItem('ceres:contentW');localStorage.removeItem('ceres:autoZoom');localStorage.removeItem('ceres:designWidth');}catch(_){}
  apply();
}());</script>

 gutter + var(--edge-w) + 8px`). : the gutter that formula depended on
 is retired -- `right` is now `calc(var(--edge-w) + 8px)` (flush strip at 0,
 plus one handle-width, plus the same 8px gap), same net effect (one
 handle-width left of the now-flush strip), no gutter term needed any more. -->
<button type="button" id="scroll-top" class="edge-toggle scroll-top" data-tip="Back to top" aria-label="Back to top"></button>
<!-- . `#badge-bar` moved OUT of `#plot-table-scroll` (see that element's
 own comment) to a direct child of <body> here -- it needs to reach the TRUE
 viewport edge, and `#plot-table-scroll` (`overflow-x: clip`) only ever
 offered its own inset right edge (a page gutter), never the real one.
 `position: absolute` (document coordinates, so it scrolls WITH the page --
 its rows track specific table rows, unlike the always-fixed Iris/wallet/
 scroll-top handles); `top`/`block-size`/`right` are all JS-computed
 (app.js::centerThemePicker()) from the scroller's own live rect (`top` =
 the scroller's document top, `block-size` = the scroller's own height,
 `right` = a negative offset that reaches past `body`'s own narrower edge --
 see that function's own comment on `--page-gutter` for why `body`'s `right:
 0` alone is NOT flush with the true viewport edge when a scrollbar is
 present, the same scrollbar-vs-viewport mismatch 's own second
 measured follow-up already documented for the FIXED elements).
 `--badge-bar-w` (1.5rem/24px, ceres.css) replaces `--edge-w` for this bar and
 its own head/flag below -- "the entire slide bar must be thinner" -- the
 Iris/Wallet handles keep their own `--edge-w`.
 The head glyph moved OUT of the bar too, into a SEPARATE standalone
 `#badge-flag` (below) -- `position: fixed` (not sticky/nested inside the now
 document-scrolling `#badge-bar`), because only a `position: fixed` element's
 `right: 0` reaches the true, scrollbar-proof viewport edge the Iris/Wallet/
 scroll-top handles already use; nesting it inside the now-absolute `#badge-
 bar` would inherit THAT element's own (gutter-narrowed) right edge instead,
 reintroducing exactly the mismatch this whole ticket exists to remove. Its own
 `top`/`block-size` are JS-computed from `#table-head-sticky`'s own live rect
 each sync AND on a passive scroll listener (app.js) -- the real thead's
 viewport position changes continuously with scroll until it "sticks", so a
 one-shot measurement on layout-change events alone is not enough here (unlike
 the Iris dock, which centres on the ALWAYS-sticky-at-top:0 app header).
 `.badge-bar` itself keeps its own `role="button"`/background-click-toggles-

 retired -era `#badge-flag` did. See library/ceres-badge-overlay.md and
 ceres-edge-tabs.md v9/v10 for the full design and the headless verification
 numbers. -->

<main id="board-main">
  <!-- R-145 / — "Sixfold Harvest", his chosen design, built with global tokens
 only so it follows whichever Iris theme is elected. Replaces the spinner in the
 full-width bordered box that used to sit here: that box occupied FLOW space, so it
 shoved the plot table down every time it appeared and snapped it back when it
 went. This layer is `position: fixed`, so it contributes zero height to
 `#board-main` and the layout shift goes with it.
 EVERY BEHAVIOUR CONTRACT IS PRESERVED DELIBERATELY: the same `#board-loading` id,
 the same `hidden` attribute the delayed-spinner gates in board.js toggle, the same
 polite status role, and the same `.board-loading-text` node the dynamic progress
 text is written into. board.js is not touched -- the 200ms entrance gate and the
 300ms minimum-visibility floor still decide WHEN this appears, so a fast load
 still shows nothing at all rather than flashing artwork for 80ms.
 The art is decorative and `aria-hidden`; the status text remains the only thing a
 screen reader is given. Nothing here is interactive and nothing takes focus. -->
  <div class="board-loading" id="board-loading" role="status" aria-live="polite" hidden>
    <div class="harvest-stage" aria-hidden="true">
      <!-- second attempt. The first drew the spokes at viewBox radii 131-246
 while the seal's own radius is 261 -- so every spoke was painted UNDERNEATH the
 opaque seal and rendered zero visible pixels. Verification caught it by pixel
 geometry and by looking; I had scaled the mockup's coordinates into a different
 viewBox without recomputing them against the seal.
 Checking the geometry properly also showed the hexagon was never regular: the
 stations sat at radii of 351 and 366 units, so no single ring could pass through
 them. Both are now derived rather than transcribed -- stations on a true regular
 hexagon at r=351, seal at r=207 (inset 27%), leaving 58 units of clear space for
 spokes that are actually visible in it. viewBox is 900x900 and the geometry
 below is in those units. -->
      <svg class="harvest-paths" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <circle cx="450" cy="450" r="351"/>
        <circle cx="450" cy="450" r="375" opacity=".4"/>
        <!-- R-148: the progress arc. It rides the ring that already circumscribes
 the six stations, so it adds no element to the composition and cannot
 change its layout. Length is driven by --harvest-progress, which
 board.js sets from the MEASURED fetched/total; when no total is known
 yet the host is marked indeterminate and this arc is not drawn at all,
 rather than being shown at zero. -->
        <circle class="harvest-progress" cx="450" cy="450" r="375"
                pathLength="1000" transform="rotate(-90 450 450)"/>
        <path d="M450 234L450 192M637 342L673 321M637 558L673 579M450 666L450 708M263 558L227 579M263 342L227 321"/>
      </svg>
      <div class="harvest-seal">
        <span class="harvest-scene" aria-hidden="true">
          <img class="harvest-land" src="/static/assets/web/land/terrain-backgrounds/lake_natural_underwater_build.webp" alt="">
          <img class="harvest-farm" src="/static/assets/land/worksites/productionBuilding/grain/plot/lake_underwater_lvl_1.webp" alt="">
        </span>
        <span class="harvest-glow"></span>
        <span class="harvest-fill" aria-hidden="true"></span><!-- Capture/read milestones; full charge only after board render. -->
      </div>
      <!-- node order is the ring clockwise from 12 o'clock (1=12, 2=2, 3=4, 4=6, 5=8, 6=10). --hd runs
 the 6 s emphasis pass in that same direction: node k peaks (k-1) s after node 1 (negative delays
 so nothing waits at start). Lit cascade, spoke dash and bump are keyed on data-node and follow. -->
      <div class="harvest-node" data-node="1" style="--hx:50%;--hy:11%;--hd:0s"><img src="/static/assets/resources/grain.png" alt=""></div>
      <div class="harvest-node" data-node="2" style="--hx:83.8%;--hy:30.5%;--hd:-5s"><img src="/static/assets/resources/wood_500.webp" alt=""></div>
      <div class="harvest-node" data-node="3" style="--hx:83.8%;--hy:69.5%;--hd:-4s"><img src="/static/assets/resources/stone_500.webp" alt=""></div>
      <div class="harvest-node" data-node="4" style="--hx:50%;--hy:89%;--hd:-3s"><img src="/static/assets/resources/iron_500.webp" alt=""></div>
      <div class="harvest-node" data-node="5" style="--hx:16.2%;--hy:69.5%;--hd:-2s"><img src="/static/assets/resources/research.png" alt=""></div>
      <div class="harvest-node" data-node="6" style="--hx:16.2%;--hy:30.5%;--hd:-1s"><img src="/static/assets/resources/aura_500.webp" alt=""></div>
    </div>

  <table class="plot-table" id="plot-table">
    <colgroup>
      <col class="col-w-plot"><col class="col-w-rarity"><col class="col-w-type">
      <col class="col-w-terrain"><col class="col-w-worksite">

      <tr>

        <th class="col-num" data-key="harvest_pp">Total PP<span class="sort-chevron" aria-hidden="true"></span></th>
        <th class="col-num" data-key="construction_pp" aria-label="Boostable"><span class="fr1946-column-label-full">Boostable</span><span class="fr1946-column-label-short" data-label="Boost." aria-hidden="true"></span><span class="sort-chevron" aria-hidden="true"></span></th>
        <th class="col-num" data-key="base_pp">Base PP<span class="sort-chevron" aria-hidden="true"></span></th>

        <th class="col-num" data-key="food_per_hour">Food/hr<span class="sort-chevron" aria-hidden="true"></span></th>
        <!-- three material-input columns after Food/hr, each sortable (maintainer

        <th class="col-num col-w-wood" data-key="wood_cost_per_hour" aria-label="Wood per hour">Wood/hr<span class="sort-chevron" aria-hidden="true"></span></th>
        <th class="col-num col-w-stone" data-key="stone_cost_per_hour" aria-label="Stone per hour">Stone/hr<span class="sort-chevron" aria-hidden="true"></span></th>
        <th class="col-num col-w-iron" data-key="iron_cost_per_hour" aria-label="Iron per hour">Iron/hr<span class="sort-chevron" aria-hidden="true"></span></th>

        <!-- (maintainer): a counting column, last (right of the locks, before the badges): 1..N over the plots LISTED (after filters and sort), not sortable; its header shows N. -->
        <th class="col-w-count" aria-label="Plots listed" data-tip="Plots listed" data-tip-body="The number of plots listed with the current filters. Each row shows its position."><span class="count-total">0</span></th>
      </tr>
    </thead>
    <tbody id="plot-tbody"></tbody>
